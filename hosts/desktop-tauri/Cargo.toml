[package]
name = "agentnotify-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "agentnotify_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentnotify-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive", "collect", "serde_json"] }
specta-typescript = "=0.0.12"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
agentnotify-application = { path = "../../crates/agentnotify-application" }
agentnotify-agent-antigravity = { path = "../../crates/agentnotify-agent-antigravity" }
agentnotify-agent-codex = { path = "../../crates/agentnotify-agent-codex" }
agentnotify-agent-commandcode = { path = "../../crates/agentnotify-agent-commandcode" }
agentnotify-agent-devin = { path = "../../crates/agentnotify-agent-devin" }
agentnotify-agent-opencode = { path = "../../crates/agentnotify-agent-opencode" }
agentnotify-agent-sdk = { path = "../../crates/agentnotify-agent-sdk" }
agentnotify-channel-clawbot = { path = "../../crates/agentnotify-channel-clawbot" }
agentnotify-channel-sdk = { path = "../../crates/agentnotify-channel-sdk" }
agentnotify-domain = { path = "../../crates/agentnotify-domain" }
agentnotify-ingress = { path = "../../apps/ingress" }
agentnotify-runtime = { path = "../../crates/agentnotify-runtime" }
agentnotify-storage-sqlite = { path = "../../crates/agentnotify-storage-sqlite" }
sha2 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tauri-plugin-notification = "2"
tokio = { workspace = true }
tracing = { workspace = true }
zip = { version = "7", default-features = false, features = ["deflate"] }
reqwest = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
agentnotify-testkit = { path = "../../crates/agentnotify-testkit" }
rusqlite.workspace = true
tempfile.workspace = true
