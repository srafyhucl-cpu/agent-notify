[package]
name = "agentnotify-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "agentnotify_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentnotify-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }

[dev-dependencies]
serde_json = "1"
