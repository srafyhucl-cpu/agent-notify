[package]
name = "agentnotify-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "agentnotify_desktop"
path = "src/lib.rs"

[[bin]]
name = "agentnotify-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive", "collect", "serde_json"] }
specta-typescript = "=0.0.12"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
