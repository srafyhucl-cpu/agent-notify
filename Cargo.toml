[workspace]
resolver = "3"
members = [
  "apps/ingress",
  "apps/hooks/antigravity",
  "apps/hooks/codex",
  "apps/hooks/devin",
  "hosts/desktop-tauri",
  "crates/agentnotify-agent-antigravity",
  "crates/agentnotify-agent-codex",
  "crates/agentnotify-agent-commandcode",
  "crates/agentnotify-agent-devin",
  "crates/agentnotify-agent-opencode",
  "crates/agentnotify-domain",
  "crates/agentnotify-application",
  "crates/agentnotify-runtime",
  "crates/agentnotify-storage-sqlite",
  "crates/agentnotify-agent-sdk",
  "crates/agentnotify-channel-sdk",
  "crates/agentnotify-channel-clawbot",
  "crates/agentnotify-testkit",
]

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
fs2 = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }
