name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          rustup default stable
          rustc --version

      - name: Verify tag and application version
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($tag -ne $version) { throw "tag v$tag does not match VERSION $version" }
          Write-Output "Version verified: $version"

      - name: Verify version consistency
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/check-version.ps1 -Version $tag

      - name: Install Inno Setup
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -UseBasicParsing
          $process = Start-Process $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$dir"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: exit=$($process.ExitCode)" }
          "AGENT_NOTIFY_ISCC=$dir\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: Require signing secret
        shell: powershell
        env:
          AGENT_NOTIFY_SIGN_PFX_BASE64: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AGENT_NOTIFY_SIGN_PFX_BASE64)) {
            throw 'AGENT_NOTIFY_SIGN_PFX_BASE64 is not configured. Releases must be signed: clients pin the built-in certificate thumbprint and reject unsigned packages, so an unsigned release cannot be installed. Configure the signing secret before tagging.'
          }

      - name: Build release archive
        shell: powershell
        env:
          AGENT_NOTIFY_SIGNTOOL: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_BASE64 != '' && format('{0}\tools\sign-selfsigned.cmd', github.workspace) || '' }}
          AGENT_NOTIFY_SIGN_PFX_BASE64: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_BASE64 }}
          AGENT_NOTIFY_SIGN_PFX_PASSWORD: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_PASSWORD }}
        run: ./tools/build-release.ps1

      - name: Extract release notes
        id: notes
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
              $start = $i
              continue
            }
            if ($start -ge 0 -and $i -gt $start -and $lines[$i] -match '^## \[') {
              $end = $i
              break
            }
          }
          $body = ''
          if ($start -ge 0) {
            $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          }
          [IO.File]::WriteAllText('release-notes.md', $body, (New-Object System.Text.UTF8Encoding($false)))
          if ($body.Length -gt 0) {
            'has_notes=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            'has_notes=false' | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          }

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PowerShell 5.1 with ErrorActionPreference=Stop (Actions default) turns gh stderr into a
          # terminating error, so check $LASTEXITCODE explicitly and keep Continue here.
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.ref_name }}'
          $zipItem = Get-ChildItem dist\Agent-notify-v*.zip | Select-Object -First 1
          $setupItem = Get-ChildItem dist\Agent-notify-Setup-v*.exe | Select-Object -First 1
          if (-not $zipItem) { throw 'Release ZIP was not generated' }
          if (-not $setupItem) { throw 'Release installer was not generated' }
          $zip = $zipItem.FullName
          $setup = $setupItem.FullName
          $hasNotes = '${{ steps.notes.outputs.has_notes }}' -eq 'true'

          & gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tag "$setup" "$zip" dist\SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit $LASTEXITCODE)" }
            if ($hasNotes) {
              & gh release edit $tag --title "Agent-notify $tag" --notes-file release-notes.md
            } else {
              & gh release edit $tag --title "Agent-notify $tag"
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE)" }
            Write-Output "Release $tag updated in place."
          } else {
            if ($hasNotes) {
              & gh release create $tag "$setup" "$zip" dist\SHA256SUMS.txt --title "Agent-notify $tag" --notes-file release-notes.md
            } else {
              & gh release create $tag "$setup" "$zip" dist\SHA256SUMS.txt --title "Agent-notify $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
            Write-Output "Release $tag created."
          }

      - name: Mirror release to update source
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'RELEASE_REPO_TOKEN is not configured, so the update source repo (agent-notify-releases) will not receive this version and clients will keep reporting "already up to date". Add a PAT (contents:write on agent-notify-releases) as the RELEASE_REPO_TOKEN repository secret.'
          }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/publish-release.ps1 -Version $version -DistDir dist

      # Fail loudly on an empty release: the publish steps can report success while
      # the release ends up with zero assets (real case: v2.0.5).
      - name: Verify release assets
        shell: powershell
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $tag = "v$version"
          $expected = @(
            "Agent-notify-Setup-v$version.exe",
            "Agent-notify-v$version.zip",
            "SHA256SUMS.txt"
          )
          $targets = @(
            @{ Repo = '${{ github.repository }}'; Token = $env:SOURCE_TOKEN },
            @{ Repo = 'srafyhucl-cpu/agent-notify-releases'; Token = $env:MIRROR_TOKEN }
          )
          $failures = 0
          foreach ($target in $targets) {
            $env:GH_TOKEN = $target.Token
            # Query the assets endpoint by release id: the release object embedded in
            # /releases/tags/<tag> can lag behind (real case: v2.0.5 returned an empty
            # asset list while the assets endpoint already had all three files).
            $release = (gh api "repos/$($target.Repo)/releases/tags/$tag" | Out-String) | ConvertFrom-Json
            if ($release.draft) {
              Write-Output "[verify] $($target.Repo) $tag is still a draft"
              $failures++
              continue
            }
            $assetList = @(((gh api "repos/$($target.Repo)/releases/$($release.id)/assets" | Out-String) | ConvertFrom-Json))
            $names = @($assetList | ForEach-Object { $_.name })
            $missing = @()
            foreach ($name in $expected) {
              if ($names -notcontains $name) { $missing += $name }
            }
            if ($missing.Count -gt 0) {
              Write-Output "[verify] $($target.Repo) $tag is missing assets: $($missing -join ', ') (got: $($names -join ', '))"
              $failures++
            } else {
              Write-Output "[verify] $($target.Repo) $tag carries all assets"
            }
          }
          if ($failures -gt 0) {
            throw "release verification failed: an empty or incomplete release would make clients report 'already up to date' while offering nothing to install"
          }
