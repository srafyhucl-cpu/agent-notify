name: Release

on:
  push:
    tags: ['v*']
  # Dry run: exercise the release chain without publishing anything.
  # Use it to validate release-workflow changes before pushing a real tag.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry run scope: validate only, or validate + signed build'
        required: true
        default: build
        type: choice
        options:
          - validate
          - build

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and gates
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate release identity
        id: version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fileVersion = (Get-Content -LiteralPath 'VERSION' -Raw -Encoding UTF8).Trim()
          if ($env:EVENT_NAME -eq 'push') {
            $tag = $env:RELEASE_TAG
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "invalid release tag: $tag" }
            $version = $tag.Substring(1)
            if ($fileVersion -ne $version) { throw "tag $tag does not match VERSION $fileVersion" }
            $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" | ConvertFrom-Json
            if ($comparison.status -notin @('ahead', 'behind', 'identical')) {
              throw "release commit is not reachable from protected main: $env:GITHUB_SHA"
            }
          } else {
            # A dry run always validates protected main's current state and takes
            # the version from VERSION (the single source of truth).
            if ($env:REF_NAME -ne 'refs/heads/main') { throw "dry run must be started from main, got $env:REF_NAME" }
            $version = $fileVersion
            $tag = "v$version"
          }
          ./tools/check-version.ps1 -Version $version
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
  build:
    name: Build signed release assets
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.mode == 'build' }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop-ui/package-lock.json
      # tools/test.ps1 type-checks the plugin with the repo-root tsc; without
      # node_modules the release fails right at the gates.
      - name: Install TypeScript dependencies
        run: npm ci
      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          rustup default stable
          rustc --version
      # Release keeps its own cache key prefix on purpose: a release must never
      # depend on artifacts produced by a test or PR run.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install fixed PowerShell analyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Run full release gates
        shell: powershell
        run: |
          ./tools/lint.ps1
          ./tools/test.ps1
          ./tools/ui/gate.ps1
      - name: Install verified Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = if (Test-Path -LiteralPath 'D:\') { 'D:\Temp\agentnotify-release' } else { $env:RUNNER_TEMP }
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          $dir = Join-Path $tempRoot 'InnoSetup'
          $installer = Join-Path $tempRoot 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer -UseBasicParsing
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA256 mismatch: $actualHash" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if (-not $signature.SignerCertificate -or $signature.Status -ne 'Valid') { throw "Inno Setup signature is not valid: $($signature.Status)" }
          $thumbprint = $signature.SignerCertificate.Thumbprint.Replace(':', '').Replace(' ', '').ToUpperInvariant()
          if ($thumbprint -ne 'E0AB19C8D38CBF9C44709925122A7A02F8C70CB7') { throw "Inno Setup signer mismatch: $thumbprint" }
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: exit=$($process.ExitCode)" }
          "AGENT_NOTIFY_ISCC=$dir\ISCC.exe" | Out-File $env:GITHUB_ENV -Encoding ascii -Append
      - name: Require release signing secrets
        shell: powershell
        env:
          AGENT_NOTIFY_SIGN_PFX_BASE64: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_BASE64 }}
          AGENT_NOTIFY_SIGN_PFX_PASSWORD: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AGENT_NOTIFY_SIGN_PFX_BASE64)) { throw 'AGENT_NOTIFY_SIGN_PFX_BASE64 is not configured' }
          if ([string]::IsNullOrWhiteSpace($env:AGENT_NOTIFY_SIGN_PFX_PASSWORD)) { throw 'AGENT_NOTIFY_SIGN_PFX_PASSWORD is not configured' }
      - name: Build signed archive and installer
        shell: powershell
        env:
          AGENT_NOTIFY_SIGNTOOL: '${{ github.workspace }}\tools\sign-selfsigned.cmd'
          AGENT_NOTIFY_SIGN_PFX_BASE64: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_BASE64 }}
          AGENT_NOTIFY_SIGN_PFX_PASSWORD: ${{ secrets.AGENT_NOTIFY_SIGN_PFX_PASSWORD }}
        run: ./tools/build-release.ps1
      - name: Extract release notes
        shell: powershell
        env:
          # Works for both a tag push and a dry run (the validate job resolves it).
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
              $start = $i
              continue
            }
            if ($start -ge 0 -and $i -gt $start -and $lines[$i] -match '^## \[') {
              $end = $i
              break
            }
          }
          if ($start -lt 0) { throw "CHANGELOG.md does not contain version $version" }
          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) { throw "CHANGELOG.md version $version has no release notes" }
          [IO.File]::WriteAllText('release-notes.md', $body, (New-Object Text.UTF8Encoding($false)))
      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [validate, build]
    # A dry run never publishes; only a real tag push does.
    if: ${{ github.event_name == 'push' }}
    permissions:
      actions: read
      contents: write
    uses: srafyhucl-cpu/agent-notify/.github/workflows/publish-release.yml@main
    with:
      release_tag: ${{ needs.validate.outputs.release_tag }}
      source_repository: ${{ github.repository }}
      artifact_name: release-assets
    secrets:
      RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
