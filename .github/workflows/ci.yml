name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 静态检查（analyzer + tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          ./tools/lint.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci + 插件类型检查
        run: |
          npm ci
          npx tsc --noEmit

  test:
    name: 单测 + 冒烟（Windows PowerShell 5.1）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装测试依赖并运行 tools/test.ps1
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          ./tools/test.ps1
