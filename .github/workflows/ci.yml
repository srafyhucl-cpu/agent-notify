name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: TypeScript typecheck
        run: |
          npm ci
          npx tsc --noEmit

      - name: PowerShell syntax and analyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          ./tools/lint.ps1

  windows:
    name: Tests and smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Vulnerability scan (govulncheck)
        shell: powershell
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Run Go, TypeScript and smoke tests
        shell: powershell
        run: ./tools/test.ps1

  race:
    name: Race detector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Locate C compiler
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) { throw 'gcc not found; the race detector requires CGO' }
          "CC=$($gcc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run race tests
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Build frontend assets
        run: |
          npm ci --prefix apps/desktop-ui
          npm run build --prefix apps/desktop-ui

      - name: Install Rust toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          rustup default stable
          rustc --version

      - name: Run Rust gate
        shell: powershell
        run: ./tools/rust/gate.ps1
