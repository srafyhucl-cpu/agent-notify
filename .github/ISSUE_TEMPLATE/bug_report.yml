name: Bug 报告
description: 推送、Agent 接入、桌面端、更新、安装或卸载出现问题时使用
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查看 `docs/TROUBLESHOOTING.md`。
        日志不会写入 ClawBot token 或通知正文，但仍可能包含用户名、本机路径、账号提示、客户端标识和消息标识；提交前必须检查并移除不需要的个人信息。
  - type: dropdown
    id: area
    attributes:
      label: 出问题的部分
      options:
        - 微信推送（收不到、重复或内容不对）
        - 引用回复
        - OpenCode 接入
        - Codex 接入
        - Antigravity 接入
        - Devin 接入
        - Command Code 接入
        - 桌面端（窗口、托盘、设置或运行状态）
        - 应用更新
        - 安装、升级或卸载
        - 文档或其它
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows 版本与架构、Agent-notify 版本、相关 Agent 客户端版本
      placeholder: "例：Windows 11 23H2 x64 / Agent-notify 2.0.7 / Codex 1.x"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 现象与复现步骤
      description: 发生了什么、期望是什么、从哪一步开始能稳定复现
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: '桌面端：%LOCALAPPDATA%\AgentNotify\logs\runtime.log；接入调试：%TEMP%\agent-notify\*-debug.log；更新：%LOCALAPPDATA%\AgentNotify\temp\updates\last-update.log。只粘贴解决问题所需的片段。'
      render: text
  - type: textarea
    id: tried
    attributes:
      label: 已尝试的排查
    description: 例如查看 Diagnostics / Agents / Channels、重启相关客户端、运行 agentnotify-ingress.exe --doctor，或按故障排查文档处理
