name: 功能建议
description: 提出新 Agent、渠道、桌面端能力或开发体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决什么问题
      description: 先描述使用场景和痛点，再说明期望结果；不要只写实现方案
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: 涉及的 Agent 或渠道
      description: OpenCode、Codex、Antigravity、Devin、Command Code、ClawBot，或不涉及具体接入
  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: project_boundary
    attributes:
      label: 项目边界
      options:
        - label: 我理解当前正式平台是 Windows 10/11 x64
          required: true
        - label: 我已搜索现有 Issue，避免重复提出同一需求
          required: true
        - label: 我理解当前渠道是 ClawBot / 微信，新增渠道需要单独讨论协议与凭据边界
          required: false
