name: 功能建议
description: 提出新能力或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决什么问题
      description: 先描述场景与痛点，再说明期望结果
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: contract
    attributes:
      label: 项目边界
      options:
        - label: 我理解 Agent-notify 面向 Windows 10/11，优先支持 OpenCode 与 Codex
