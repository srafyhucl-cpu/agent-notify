name: 功能建议
description: 提出新能力或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决什么问题
      description: 先讲场景与痛点，再讲想要的方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: contract
    attributes:
      label: 契约检查
      options:
        - label: 我理解本项目保持 Windows + PowerShell 5.1 + 中文优先
